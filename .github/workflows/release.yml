# Cut a release: bump the version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json,
# commit, then push a tag `vX.Y.Z`. This builds signed bundles on all three platforms and creates a
# DRAFT GitHub release with latest.json. Installed apps only see the update after you publish the draft.
#
# The signing key lives in the `release` environment (Settings -> Environments), which requires a manual
# approval before the job runs: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set).
# The tagged commit must be on main, so a tag on an unreviewed branch can never release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # create the draft release and upload assets
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release"
            exit 1
          fi

      - name: Tag must match app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"; do
            if [ "$v" != "$tag" ]; then echo "version $v does not match tag $tag"; exit 1; fi
          done

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: src-tauri }

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Veydrak ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
