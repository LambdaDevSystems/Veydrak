[package]
name = "veydrak"
version = "0.1.0"
description = "Veydrak: a sci-fi terminal dashboard"
edition = "2021"

[lib]
name = "veydrak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net", "rt"] }
portable-pty = "0.8"
sysinfo = "0.31"
mdns-sd = "0.11"
surge-ping = "0.8"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "z"
